<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hyperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C1B"/>
      <stop offset="50%" stop-color="#080812"/>
      <stop offset="100%" stop-color="#05050A"/>
    </linearGradient>
    <linearGradient id="neonSphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#00E5A8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="hyperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#hyperBg)"/>

  <!-- Viewport Grid Lines -->
  <circle cx="400" cy="225" r="180" fill="none" stroke="rgba(108, 99, 255, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="225" r="230" fill="none" stroke="rgba(0, 229, 168, 0.1)" stroke-width="1"/>

  <!-- 3D Polyhedral Spatial Form Representation -->
  <g transform="translate(400, 225)">
    <!-- Rotating wireframe geodesic polygons -->
    <polygon points="0,-120 100,-40 60,80 -60,80 -100,-40" fill="rgba(108, 99, 255, 0.12)" stroke="url(#neonSphere)" stroke-width="2.5" filter="url(#hyperGlow)"/>
    <polygon points="0,-120 0,20 60,80" fill="rgba(0, 229, 168, 0.2)" stroke="#00E5A8" stroke-width="1.5"/>
    <polygon points="0,-120 0,20 -60,80" fill="rgba(108, 99, 255, 0.25)" stroke="#6C63FF" stroke-width="1.5"/>
    <polygon points="0,20 100,-40 60,80" fill="rgba(0, 240, 255, 0.15)" stroke="#00F0FF" stroke-width="1.5"/>

    <!-- Center core beacon -->
    <circle cx="0" cy="0" r="14" fill="#00E5A8" filter="url(#hyperGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Real-Time HUD Overlay Indicators -->
  <rect x="40" y="35" width="180" height="48" rx="8" fill="rgba(18, 18, 28, 0.7)" stroke="rgba(255,255,255,0.08)"/>
  <text x="55" y="55" fill="#A0A0A0" font-family="monospace" font-size="10">SPATIAL RENDERER</text>
  <text x="55" y="72" fill="#00E5A8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">THREE.JS / WEBGL 2.0</text>

  <rect x="580" y="35" width="180" height="48" rx="8" fill="rgba(18, 18, 28, 0.7)" stroke="rgba(255,255,255,0.08)"/>
  <text x="595" y="55" fill="#A0A0A0" font-family="monospace" font-size="10">DRACO MESH COMPRESSION</text>
  <text x="595" y="72" fill="#6C63FF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">92% PAYLOAD SAVINGS</text>

  <!-- Interactive Controls Bar -->
  <rect x="220" y="380" width="360" height="42" rx="21" fill="rgba(20, 20, 32, 0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="250" y="405" fill="#FFFFFF" font-family="monospace" font-size="11">ROTATE: 360° | ZOOM: 1.8X | LIGHT: PBR</text>
  <circle cx="545" cy="401" r="5" fill="#00E5A8"/>
</svg>
