<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E18"/>
      <stop offset="100%" stop-color="#06060A"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00E5A8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <pattern id="canvasGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#canvasGrid)"/>

  <!-- Top App Navigation Bar -->
  <rect x="30" y="25" width="740" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="55" cy="46" r="5" fill="#FF5376"/>
  <circle cx="72" cy="46" r="5" fill="#FFB800"/>
  <circle cx="89" cy="46" r="5" fill="#00E5A8"/>
  <text x="120" y="51" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" opacity="0.9">AURA NEURAL LABS // INFINITE GRAPH CANVAS</text>
  <rect x="620" y="34" width="130" height="24" rx="12" fill="rgba(0, 229, 168, 0.15)" stroke="rgba(0,229,168,0.4)"/>
  <text x="642" y="50" fill="#00E5A8" font-family="monospace" font-size="10" font-weight="bold">● LIVE STREAMING</text>

  <!-- Connection Bezier Curves -->
  <path d="M 230 180 C 310 180, 310 240, 390 240" fill="none" stroke="url(#nodeGrad1)" stroke-width="3" filter="url(#glow)"/>
  <path d="M 230 290 C 310 290, 310 240, 390 240" fill="none" stroke="url(#nodeGrad1)" stroke-width="3" filter="url(#glow)"/>
  <path d="M 550 240 C 600 240, 600 200, 650 200" fill="none" stroke="#00E5A8" stroke-width="3" filter="url(#glow)"/>

  <!-- Node 1: Input Prompts -->
  <rect x="70" y="140" width="160" height="80" rx="10" fill="#161624" stroke="#6C63FF" stroke-width="1.5" filter="url(#glow)"/>
  <rect x="70" y="140" width="160" height="24" rx="10" fill="rgba(108, 99, 255, 0.25)"/>
  <text x="85" y="156" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">NODE_01: MULTI-MODAL</text>
  <text x="85" y="185" fill="#A0A0A0" font-family="sans-serif" font-size="11">Weights: SDXL + Claude 3</text>
  <text x="85" y="205" fill="#00E5A8" font-family="monospace" font-size="10">Latent Seed: #849204</text>

  <!-- Node 2: Audio Synesthesia -->
  <rect x="70" y="250" width="160" height="80" rx="10" fill="#161624" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <rect x="70" y="250" width="160" height="24" rx="10" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="85" y="266" fill="#A0A0A0" font-family="monospace" font-size="10">NODE_02: SPECTROGRAM</text>
  <path d="M 85 305 Q 110 280 130 305 T 175 305" fill="none" stroke="#00E5A8" stroke-width="2"/>

  <!-- Central Node: Neural Fusion Engine -->
  <rect x="390" y="170" width="160" height="140" rx="12" fill="#141426" stroke="#00E5A8" stroke-width="2" filter="url(#glow)"/>
  <rect x="390" y="170" width="160" height="28" rx="12" fill="rgba(0, 229, 168, 0.2)"/>
  <text x="405" y="189" fill="#00E5A8" font-family="monospace" font-size="11" font-weight="bold">SYNTHESIS ENGINE</text>
  <circle cx="470" cy="245" r="30" fill="none" stroke="#6C63FF" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="470" cy="245" r="16" fill="rgba(108, 99, 255, 0.4)"/>
  <text x="428" y="295" fill="#FFFFFF" font-family="monospace" font-size="10">0.024s Inference</text>

  <!-- Output Node -->
  <rect x="650" y="150" width="110" height="100" rx="10" fill="#161624" stroke="rgba(255,255,255,0.2)"/>
  <text x="665" y="175" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">RESULT_STREAM</text>
  <rect x="665" y="190" width="80" height="45" rx="6" fill="rgba(108, 99, 255, 0.3)" stroke="#6C63FF"/>
  <text x="682" y="217" fill="#00E5A8" font-family="sans-serif" font-size="11" font-weight="bold">4K HDR</text>

  <!-- Bottom HUD stats -->
  <rect x="30" y="380" width="740" height="40" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.06)"/>
  <text x="50" y="405" fill="#A0A0A0" font-family="monospace" font-size="11">FPS: <tspan fill="#00E5A8">60.0</tspan> | MEMORY: <tspan fill="#FFFFFF">124 MB</tspan> | LATENCY: <tspan fill="#00E5A8">18ms</tspan> | WORKERS: <tspan fill="#6C63FF">8 CLUSTERS ACTIVE</tspan></text>
</svg>
