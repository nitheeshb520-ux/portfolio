<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="marketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="freshMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5A8"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
    <filter id="marketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#marketBg)"/>

  <!-- Subtle Grid Pattern -->
  <pattern id="marketGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#marketGrid)"/>

  <!-- Top App Bar -->
  <rect x="30" y="25" width="740" height="45" rx="8" fill="#161B22" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="55" cy="47" r="5" fill="#FF5376"/>
  <circle cx="72" cy="47" r="5" fill="#FFB800"/>
  <circle cx="89" cy="47" r="5" fill="#00E5A8"/>
  <text x="120" y="52" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">LOCAL FARMERS MARKET // DIRECT PRODUCER PLATFORM</text>
  <rect x="610" y="35" width="145" height="25" rx="12" fill="rgba(0, 229, 168, 0.15)" stroke="rgba(0, 229, 168, 0.4)"/>
  <text x="625" y="51" fill="#00E5A8" font-family="monospace" font-size="10" font-weight="bold">SPRING BOOT 3 • JPA</text>

  <!-- Left Sidebar: Categories & Filters -->
  <rect x="30" y="85" width="180" height="280" rx="10" fill="#131720" stroke="rgba(255,255,255,0.06)"/>
  <text x="48" y="115" fill="#00E5A8" font-family="monospace" font-size="11" font-weight="bold">PRODUCE CATEGORIES</text>
  
  <rect x="45" y="130" width="150" height="30" rx="6" fill="rgba(108, 99, 255, 0.2)" stroke="#6C63FF"/>
  <text x="60" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">🌿 All Fresh Harvest</text>

  <rect x="45" y="170" width="150" height="28" rx="6" fill="transparent"/>
  <text x="60" y="188" fill="#A0A0A0" font-family="sans-serif" font-size="11">🥕 Organic Veggies</text>

  <rect x="45" y="205" width="150" height="28" rx="6" fill="transparent"/>
  <text x="60" y="223" fill="#A0A0A0" font-family="sans-serif" font-size="11">🍓 Seasonal Fruits</text>

  <rect x="45" y="240" width="150" height="28" rx="6" fill="transparent"/>
  <text x="60" y="258" fill="#A0A0A0" font-family="sans-serif" font-size="11">🍯 Honey &amp; Dairy</text>

  <line x1="45" y1="285" x2="195" y2="285" stroke="rgba(255,255,255,0.08)"/>
  <text x="48" y="310" fill="#666675" font-family="monospace" font-size="10">ROLE: CUSTOMER / GROWER</text>
  <text x="48" y="335" fill="#00E5A8" font-family="monospace" font-size="10">● DB: PERSISTENCE OK</text>

  <!-- Center Storefront Grid -->
  <!-- Card 1: Heirloom Tomatoes -->
  <rect x="225" y="85" width="165" height="135" rx="10" fill="#141824" stroke="rgba(255,255,255,0.08)"/>
  <rect x="235" y="95" width="145" height="55" rx="6" fill="#1C2130"/>
  <circle cx="307" cy="122" r="16" fill="#FF5376" opacity="0.8"/>
  <text x="238" y="168" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">Heirloom Tomatoes</text>
  <text x="238" y="184" fill="#A0A0A0" font-family="sans-serif" font-size="10">Valley Green Farm</text>
  <text x="238" y="208" fill="#00E5A8" font-family="monospace" font-size="12" font-weight="bold">$4.50 / lb</text>
  <rect x="330" y="195" width="50" height="20" rx="4" fill="#6C63FF"/>
  <text x="340" y="209" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">+ Add</text>

  <!-- Card 2: Organic Strawberries -->
  <rect x="400" y="85" width="165" height="135" rx="10" fill="#141824" stroke="rgba(255,255,255,0.08)"/>
  <rect x="410" y="95" width="145" height="55" rx="6" fill="#1C2130"/>
  <circle cx="482" cy="122" r="16" fill="#FF5376"/>
  <text x="413" y="168" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">Organic Strawberries</text>
  <text x="413" y="184" fill="#A0A0A0" font-family="sans-serif" font-size="10">Sunrise Orchards</text>
  <text x="413" y="208" fill="#00E5A8" font-family="monospace" font-size="12" font-weight="bold">$6.00 / box</text>
  <rect x="505" y="195" width="50" height="20" rx="4" fill="#6C63FF"/>
  <text x="515" y="209" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">+ Add</text>

  <!-- Card 3: Pure Clover Honey -->
  <rect x="225" y="230" width="165" height="135" rx="10" fill="#141824" stroke="rgba(255,255,255,0.08)"/>
  <rect x="235" y="240" width="145" height="55" rx="6" fill="#1C2130"/>
  <circle cx="307" cy="267" r="16" fill="#FFB800" opacity="0.9"/>
  <text x="238" y="313" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">Pure Raw Honey</text>
  <text x="238" y="329" fill="#A0A0A0" font-family="sans-serif" font-size="10">Highland Apiaries</text>
  <text x="238" y="353" fill="#00E5A8" font-family="monospace" font-size="12" font-weight="bold">$9.50 / jar</text>
  <rect x="330" y="340" width="50" height="20" rx="4" fill="#6C63FF"/>
  <text x="340" y="354" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">+ Add</text>

  <!-- Card 4: Farm Fresh Eggs -->
  <rect x="400" y="230" width="165" height="135" rx="10" fill="#141824" stroke="rgba(255,255,255,0.08)"/>
  <rect x="410" y="240" width="145" height="55" rx="6" fill="#1C2130"/>
  <circle cx="482" cy="267" r="16" fill="#F0E6D2"/>
  <text x="413" y="313" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">Pasture Raised Eggs</text>
  <text x="413" y="329" fill="#A0A0A0" font-family="sans-serif" font-size="10">Meadow Farm</text>
  <text x="413" y="353" fill="#00E5A8" font-family="monospace" font-size="12" font-weight="bold">$5.25 / doz</text>
  <rect x="505" y="340" width="50" height="20" rx="4" fill="#6C63FF"/>
  <text x="515" y="354" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">+ Add</text>

  <!-- Right Sidebar: Cart & Order Summary -->
  <rect x="580" y="85" width="190" height="280" rx="10" fill="#131720" stroke="rgba(255,255,255,0.06)"/>
  <text x="598" y="115" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">🛒 Order Basket (3)</text>
  <rect x="598" y="125" width="154" height="1" fill="rgba(255,255,255,0.08)"/>

  <g transform="translate(598, 140)">
    <text x="0" y="12" fill="#FFFFFF" font-family="sans-serif" font-size="11">Heirloom Tomatoes (2 lb)</text>
    <text x="120" y="12" fill="#00E5A8" font-family="monospace" font-size="11">$9.00</text>

    <text x="0" y="36" fill="#FFFFFF" font-family="sans-serif" font-size="11">Organic Strawberries (1)</text>
    <text x="120" y="36" fill="#00E5A8" font-family="monospace" font-size="11">$6.00</text>

    <text x="0" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="11">Pure Raw Honey (1)</text>
    <text x="120" y="60" fill="#00E5A8" font-family="monospace" font-size="11">$9.50</text>
  </g>

  <rect x="598" y="225" width="154" height="1" fill="rgba(255,255,255,0.08)"/>
  <text x="598" y="248" fill="#A0A0A0" font-family="sans-serif" font-size="11">Subtotal:</text>
  <text x="715" y="248" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">$24.50</text>

  <rect x="598" y="265" width="154" height="34" rx="6" fill="url(#freshMint)"/>
  <text x="632" y="287" fill="#0A0A0A" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">Checkout Order</text>

  <text x="598" y="325" fill="#666675" font-family="monospace" font-size="9">DIRECT LOCAL GROWER PAYOUT</text>
  <text x="598" y="342" fill="#00E5A8" font-family="monospace" font-size="9">● REST API ENDPOINT /ORDERS</text>

  <!-- Bottom Architecture Telemetry -->
  <rect x="30" y="380" width="740" height="42" rx="8" fill="#10141D" stroke="rgba(255,255,255,0.06)"/>
  <text x="45" y="406" fill="#A0A0A0" font-family="monospace" font-size="11">FULL STACK ARCHITECTURE: <tspan fill="#00E5A8">JAVA 21 &amp; SPRING BOOT</tspan> | DB: <tspan fill="#6C63FF">SPRING DATA JPA (MYSQL)</tspan> | FRONTEND: <tspan fill="#FFFFFF">HTML5 / MODERN CSS / VANILLA JS</tspan></text>
</svg>
