<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12111E"/>
      <stop offset="100%" stop-color="#08080E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#nexusBg)"/>

  <!-- Left Sidebar: Token Tree -->
  <rect x="30" y="25" width="220" height="400" rx="12" fill="#151524" stroke="rgba(255,255,255,0.06)"/>
  <text x="50" y="60" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">DESIGN TOKENS</text>
  <rect x="50" y="75" width="180" height="1" fill="rgba(255,255,255,0.08)"/>

  <g transform="translate(50, 95)">
    <text x="0" y="15" fill="#6C63FF" font-family="monospace" font-size="12">▶ color.primary</text>
    <text x="15" y="40" fill="#A0A0A0" font-family="monospace" font-size="11">└ 600: #6C63FF</text>
    <text x="15" y="65" fill="#00E5A8" font-family="monospace" font-size="11">└ mint: #00E5A8</text>
    <text x="0" y="100" fill="#6C63FF" font-family="monospace" font-size="12">▶ elevation.glass</text>
    <text x="15" y="125" fill="#A0A0A0" font-family="monospace" font-size="11">└ blur: 16px</text>
    <text x="15" y="150" fill="#A0A0A0" font-family="monospace" font-size="11">└ border: 1px</text>
    <text x="0" y="185" fill="#6C63FF" font-family="monospace" font-size="12">▶ typography.scales</text>
    <text x="15" y="210" fill="#A0A0A0" font-family="monospace" font-size="11">└ display: 4.4rem</text>
    <text x="15" y="235" fill="#A0A0A0" font-family="monospace" font-size="11">└ mono: JetBrains</text>
  </g>

  <!-- Right Component Playground -->
  <rect x="270" y="25" width="500" height="400" rx="12" fill="#151524" stroke="rgba(255,255,255,0.06)"/>
  <text x="295" y="60" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">COMPONENT MATRIX &amp; WCAG AAA ACCESSIBILITY</text>

  <!-- Button Previews -->
  <rect x="295" y="90" width="130" height="40" rx="20" fill="url(#nexusBg)" stroke="#6C63FF" stroke-width="1.5"/>
  <text x="325" y="115" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Primary CTA</text>

  <rect x="440" y="90" width="130" height="40" rx="20" fill="#00E5A8"/>
  <text x="470" y="115" fill="#0A0A0A" font-family="sans-serif" font-size="12" font-weight="bold">Secondary</text>

  <rect x="585" y="90" width="130" height="40" rx="20" fill="none" stroke="rgba(255,255,255,0.2)"/>
  <text x="625" y="115" fill="#FFFFFF" font-family="sans-serif" font-size="12">Ghost</text>

  <!-- Interactive Card Preview -->
  <rect x="295" y="160" width="450" height="160" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="340" cy="210" r="24" fill="#6C63FF" opacity="0.3"/>
  <circle cx="340" cy="210" r="14" fill="#6C63FF"/>
  <text x="380" y="205" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Adaptive Card Primitive</text>
  <text x="380" y="228" fill="#A0A0A0" font-family="sans-serif" font-size="12">Autonomous dark mode contrast ratios &gt; 8.5:1</text>
  <rect x="380" y="250" width="90" height="26" rx="13" fill="rgba(0, 229, 168, 0.15)" stroke="#00E5A8"/>
  <text x="395" y="267" fill="#00E5A8" font-family="monospace" font-size="10">● PASS 100%</text>

  <!-- Bottom Sync Status -->
  <rect x="295" y="345" width="450" height="60" rx="10" fill="#0E0E18" stroke="rgba(255,255,255,0.06)"/>
  <text x="315" y="380" fill="#A0A0A0" font-family="monospace" font-size="11">FIGMA SYNC: <tspan fill="#00E5A8">v2.4.0 COMMITTED</tspan> | REACT NPM: <tspan fill="#6C63FF">@nexus/ui v4.1</tspan></text>
</svg>
